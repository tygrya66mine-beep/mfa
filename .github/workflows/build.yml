name: Build Geode Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: win
          sdk: latest
          cli: latest

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-mod
          path: ${{ steps.build.outputs.build-output }}
